name: Build and Deploy to Lovable

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Lovable (token-based or GitHub integration)
        env:
          LOVABLE_TOKEN: ${{ secrets.LOVABLE_TOKEN }}
        run: |
          # If a LOVABLE_TOKEN secret is provided, run the token-based deploy script.
          # Otherwise, assume you use Lovable's GitHub integration (connect repository in Lovable dashboard)
          # which will trigger deployments on pushes to `main` and does not require a token here.
          if [ -n "${LOVABLE_TOKEN:-}" ]; then
            if [ -x ".github/scripts/deploy-to-lovable.sh" ]; then
              bash .github/scripts/deploy-to-lovable.sh
            else
              echo "Deploy script exists but is not executable. Making it executable and running."
              chmod +x .github/scripts/deploy-to-lovable.sh
              bash .github/scripts/deploy-to-lovable.sh
            fi
          else
            echo "LOVABLE_TOKEN secret not set."
            echo "If you have connected this GitHub repository to Lovable via the GitHub integration, pushes to 'main' will trigger deployment automatically." 
            echo "See: https://docs.lovable.dev/integrations/github"
          fi
